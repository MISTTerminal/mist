name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --check server/index.js && node --check client/app.js && node --check client/wallet.js && node --check client/landing.js && node --check test/run.js
      - run: npm test
