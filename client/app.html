<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MIST Terminal</title>
<meta name="description" content="The private trading terminal for Solana. A fresh wallet for every position, funded through a route nobody can follow back to you.">
<link rel="icon" href="/favicon.svg">
<link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="weather"><i></i><i></i><i></i><i></i></div>
<div class="shell">
  <header class="top">
    <a class="brand" href="/"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 9h20"/><path d="M3 16h17" opacity=".55"/><path d="M9 23h20" opacity=".28"/></svg><span>MIST</span></a>
    <nav class="tabs"><a href="#/discover" data-tab="discover">Discover</a><a href="#/vault" data-tab="vault">Compartments</a><a href="#/activity" data-tab="activity">Activity</a><a href="/docs" class="hide-s">Docs</a></nav>
    <div class="find"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><input id="q" placeholder="Search a token or paste an address" autocomplete="off" spellcheck="false"><div id="results" class="results glass" hidden></div></div>
    <button class="ib" id="mistbtn" title="Blur the screen ( ` )"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.500 8 14.500 8s-2.4 4.500-6.500 4.500S1.500 8 1.500 8Z"/><circle cx="8" cy="8" r="1.9"/></svg></button>
    <button class="btn" id="vaultbtn">Open vault</button>
  </header>
  <main id="view"></main>
  <footer class="strip"><span><i class="dot" id="relaydot"></i><span id="relay">Relay connected</span></span><span class="mono">SOL <span id="solpx">—</span></span><span class="hide-s">Your browser talks to this relay only. No account, no cookies, no log.</span><span class="sp mono">Vault <span class="s" id="total">—</span></span></footer>
</div>
<div class="orders" id="orders"></div>
<div id="modal"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
